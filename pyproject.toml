[project]
name = "pferd"
version = "0.1.0"
description = "PFERD (Poses for Equine Research Dataset) パイプライン"
requires-python = "==3.8.*"
dependencies = [
    "torch==1.8.2",
    "torchvision==0.9.2",
    "torchaudio==0.8.2",
    "opencv-python==4.7.0.72",
    "chumpy==0.70",
    "smplx[all]==0.1.28",
    "aitviewer==1.9.0",
    "loguru==0.6.0",
    "scikit-learn==1.0.2",
    "scipy==1.7.3",
    "pandas==1.3.5",
    "numpy==1.21.6",
    # chumpyはno-build-isolationでビルドするため、wheelが事前に
    # この環境へインストールされている必要がある（bdist_wheelコマンド用）。
    "wheel",
    # aitviewerがPyQt5を要求するが、最新のpyqt5-qt5(5.15.19)にWindows向け配布物がないため
    # Windowsで動作実績のあるバージョンに固定する。
    "pyqt5==5.15.10",
    "pyqt5-qt5==5.15.2",
    "pyqt5-sip==12.13.0",
]

# ezc3d は意図的に含めていない: PyPI版はPython>=3.10専用で、このプロジェクトの
# Python 3.8（torch==1.8.2の制約）とは共存できない。conda-forge版
# （`conda install -c conda-forge ezc3d=1.4.9`）を使うか、CMake+MSVCで
# ソースビルドする必要がある。--VISUAL_MOCAP（C3Dモーションキャプチャ重畳表示）
# でのみ必要で、npzベースの本パイプライン（scripts/ 配下）では未使用。

[[tool.uv.index]]
name = "pytorch-lts-cu111"
url = "https://download.pytorch.org/whl/lts/1.8/cu111"
explicit = true

[tool.uv.sources]
torch = { index = "pytorch-lts-cu111" }
torchvision = { index = "pytorch-lts-cu111" }
torchaudio = { index = "pytorch-lts-cu111" }

[tool.uv]
# chumpyはビルド時にnumpy/wheelを必要とするため、依存解決を待たずに
# 既にインストール済みの環境を使ってビルドする（build isolationなし）。
no-build-isolation-package = ["chumpy"]
