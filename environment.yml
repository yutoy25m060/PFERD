# 【非推奨】通常は `uv sync`（pyproject.toml / uv.lock）を使ってください。
# このファイルは、ezc3d や psbody.mesh など uv では入れられない依存関係を
# 別途condaで用意したい場合の参考として残しています。
#
# PFERD 環境セットアップ手順（conda版）
# 1. Anaconda または Miniconda をインストールしてください。
# 2. この environment.yml があるディレクトリで、以下のコマンドを実行してください：
#    conda env create -f environment.yml
# 3. 環境を有効化します：
#    conda activate PFERD
# 4. 既存の環境を更新したい場合は、以下のコマンドを実行してください：
#    conda env update -f environment.yml --prune
# 5. 必要に応じて pip で追加パッケージをインストールします（自動でインストールされますが、失敗した場合など）。
# 6. 開発・実行を開始してください。
